version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-app
    container_name: laravel-app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
    depends_on:
      - mailpit
    networks:
      - laravel

  mailpit:
    image: axllent/mailpit
    container_name: laravel-mailpit
    ports:
      - "8025:8025"   # Giao diện web
      - "1025:1025"   # SMTP server
    networks:
      - laravel

networks:
  laravel:

volumes:
  dbdata:
