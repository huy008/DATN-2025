version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-app
    container_name: laravel-app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www:cached       # Tối ưu cho Docker Desktop trên Windows
    networks:
      - laravel
    working_dir: /var/www
    command: php artisan serve --host=0.0.0.0 --port=8000

  mailpit:
    image: axllent/mailpit
    container_name: laravel-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - laravel

networks:
  laravel:
    driver: bridge
